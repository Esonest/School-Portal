{% extends 'accounts/base.html' %}

{% block content %}

<div class="min-h-screen bg-gray-50 py-10">

    <div class="max-w-lg mx-auto bg-white rounded-2xl shadow-lg border p-8 text-center">

        <div class="text-5xl mb-5">
            ⚠️
        </div>


        <h1 class="text-2xl font-bold text-gray-800 mb-3">
            Delete Assignment?
        </h1>


        <p class="text-gray-600 mb-6">

            Are you sure you want to delete:

            <span class="font-semibold text-gray-900">
                {{ assignment.title }}
            </span>

            ?

            <br>

            This action cannot be undone.

        </p>



        <form method="POST"
              action="{% url 'assignments:delete_assignment' assignment.pk %}">

            {% csrf_token %}


            <div class="flex justify-center gap-4">


                <button type="submit"
                        class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-semibold">

                    Yes, Delete

                </button>



                <a href="{% url 'assignments:dashboard' %}"
                   class="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl font-semibold">

                    Cancel

                </a>


            </div>


        </form>


    </div>

</div>

{% endblock %}
