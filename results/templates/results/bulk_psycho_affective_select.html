{% extends 'accounts/base.html' %}

{% block content %}
<div class="w-full max-w-4xl mx-auto px-3 py-4 sm:px-6 sm:py-6">

  <!-- Page Heading -->
  <h1 class="text-xl sm:text-2xl text-{{ school.theme_color }}-600 font-semibold mb-4 leading-tight">
    Bulk Psychomotor &amp; Affective Entry
  </h1>

  <!-- Form Card -->
  <div class="bg-white shadow-sm sm:shadow rounded-xl border border-gray-100 p-3 sm:p-5">

    <form method="get" class="flex flex-col sm:flex-row gap-4 sm:gap-3 sm:items-end">

      <!-- Class Selection -->
      <div class="w-full min-w-0 sm:flex-1">
        <label for="class_id" class="block text-sm font-medium text-gray-700 mb-1">
          Select Class
        </label>

        <select
          id="class_id"
          name="class_id"
          class="block w-full min-w-0 rounded-lg border border-gray-300 bg-white p-3 text-base text-gray-800 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"
          required
        >
          <option value="">-- Choose Class --</option>
          {% for cls in classes %}
            <option value="{{ cls.id }}" {% if request.GET.class_id == cls.id|stringformat:"s" %}selected{% endif %}>
              {{ cls.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- Open Button -->
      <div class="w-full sm:w-auto">
        <button
          type="submit"
          class="w-full sm:w-auto min-h-12 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold px-6 py-3 rounded-lg shadow-sm transition-colors"
        >
          Open Class
        </button>
      </div>

    </form>

  </div>
</div>
{% endblock %}
