<!-- class_score_settings.html -->
{% extends "accounts/base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto p-6">
    <h2 class="text-2xl font-bold mb-6 text-{{ school.theme_color }}-600">
        {{ school.name }} - Class Score Settings
    </h2>

    <form method="post" class="bg-white shadow rounded p-6">
        {% csrf_token %}

        <table class="w-full table-auto border">
            <thead class="bg-gray-100">
                <tr>
                    <th class="p-3 border">Class</th>
                    <th class="p-3 border">CA Max</th>
                    <th class="p-3 border">Exam Max</th>
                    <th class="p-3 border">Show Position</th>
                </tr>
            </thead>

            <tbody>
                {% for cls in classes %}
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 border font-medium">
                        {{ cls.name }}
                    </td>

                    <td class="p-3 border">
                        <input
                            type="number"
                            name="ca_max_{{ cls.id }}"
                            value="{{ cls.score_setting.ca_max|default:0 }}"
                            class="w-24 px-3 py-2 border rounded"
                            min="0"
                        >
                    </td>

                    <td class="p-3 border">
                        <input
                            type="number"
                            name="exam_max_{{ cls.id }}"
                            value="{{ cls.score_setting.exam_max|default:0 }}"
                            class="w-24 px-3 py-2 border rounded"
                            min="0"
                        >
                    </td>

                    <td class="p-3 border text-center">
    <label class="relative inline-flex items-center cursor-pointer">
        <input
            type="checkbox"
            name="show_position_{{ cls.id }}"
            class="sr-only peer"
            {% if cls.score_setting.show_position %}checked{% endif %}
        >

        <!-- Toggle Background -->
        <div class="w-11 h-6 bg-gray-300 rounded-full
                    transition-colors duration-300
                    peer-checked:bg-green-600
                    peer-focus:ring-4 peer-focus:ring-green-300
                    dark:peer-focus:ring-green-800
                    relative">

            <!-- Toggle Circle -->
            <span class="absolute top-0.5 left-0.5
                         bg-white border border-gray-300
                         rounded-full h-5 w-5
                         transition-transform duration-300
                         peer-checked:translate-x-5">
            </span>
        </div>
    </label>
</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="mt-6">
            <button
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded shadow"
            >
                Save Settings
            </button>
        </div>
    </form>
</div>
{% endblock %}
