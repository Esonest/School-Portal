{% extends "accounts/base.html" %}

{% block content %}

<style>
  .score-settings-page {
    width: 100%;
    max-width: 1152px;
    margin: 0 auto;
    padding: 16px 12px 28px;
    box-sizing: border-box;
  }

  .score-settings-page * {
    box-sizing: border-box;
  }

  .score-settings-page input[type="number"] {
    display: block;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
    background: #fff;
  }

  .score-settings-page input[type="number"]:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
  }

  .score-class-card {
    width: 100%;
    min-width: 0;
    padding: 15px;
    margin-bottom: 14px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 2px 7px rgba(0, 0, 0, 0.05);
  }

  .score-class-name {
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .score-mobile-field {
    min-width: 0;
    margin-top: 14px;
  }

  .score-mobile-field label {
    display: block;
    margin-bottom: 6px;
    color: #374151;
    font-size: 14px;
    font-weight: 600;
  }

  .score-table-wrapper {
    display: none;
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .score-mobile-list {
    display: block;
  }

  .score-settings-page .show-position-control {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 48px;
    min-height: 44px;
    cursor: pointer;
  }

  .score-settings-page .show-position-control input {
    width: 20px;
    height: 20px;
    accent-color: #16a34a;
  }

  .score-settings-page .save-settings-btn {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 12px 18px;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  @media (min-width: 768px) {
    .score-settings-page {
      padding: 28px 24px;
    }

    .score-table-wrapper {
      display: block;
    }

    .score-mobile-list {
      display: none;
    }

    .score-settings-page .save-settings-btn {
      width: auto;
      min-width: 180px;
    }
  }
</style>

<div class="score-settings-page">

  <h2 class="text-xl sm:text-2xl font-bold mb-5 sm:mb-6 text-{{ school.theme_color }}-600 break-words">
    {{ school.name }} - Class Score Settings
  </h2>

  <form method="post" class="w-full min-w-0 bg-white shadow rounded-xl p-3 sm:p-6">
    {% csrf_token %}

    <!-- TABLE FOR TABLETS AND DESKTOPS -->
    <div class="score-table-wrapper">
      <table class="w-full table-auto border border-gray-200">
        <thead class="bg-gray-100">
          <tr>
            <th class="p-3 border text-left">Class</th>
            <th class="p-3 border text-left">CA Max</th>
            <th class="p-3 border text-left">Exam Max</th>
            <th class="p-3 border text-center">Show Position</th>
          </tr>
        </thead>

        <tbody>
          {% for cls in classes %}
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3 border font-medium">
              {{ cls.name }}
            </td>

            <td class="p-3 border">
              <input
                type="number"
                name="ca_max_{{ cls.id }}"
                value="{{ cls.score_setting.ca_max|default:0 }}"
                class="w-full px-3 py-2 border rounded"
                min="0"
              >
            </td>

            <td class="p-3 border">
              <input
                type="number"
                name="exam_max_{{ cls.id }}"
                value="{{ cls.score_setting.exam_max|default:0 }}"
                class="w-full px-3 py-2 border rounded"
                min="0"
              >
            </td>

            <td class="p-3 border text-center">
              <label class="show-position-control">
                <input
                  type="checkbox"
                  name="show_position_{{ cls.id }}"
                  {% if cls.score_setting.show_position %}checked{% endif %}
                >
              </label>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <!-- RESPONSIVE CARDS FOR ANDROID PHONES -->
    <div class="score-mobile-list">
      {% for cls in classes %}
      <div class="score-class-card">

        <h3 class="score-class-name text-base font-bold text-gray-800 pb-3 border-b border-gray-100">
          {{ cls.name }}
        </h3>

        <div class="score-mobile-field">
          <label for="ca_max_mobile_{{ cls.id }}">CA Maximum Score</label>
          <input
            type="number"
            id="ca_max_mobile_{{ cls.id }}"
            name="ca_max_{{ cls.id }}"
            value="{{ cls.score_setting.ca_max|default:0 }}"
            min="0"
          >
        </div>

        <div class="score-mobile-field">
          <label for="exam_max_mobile_{{ cls.id }}">Exam Maximum Score</label>
          <input
            type="number"
            id="exam_max_mobile_{{ cls.id }}"
            name="exam_max_{{ cls.id }}"
            value="{{ cls.score_setting.exam_max|default:0 }}"
            min="0"
          >
        </div>

        <div class="score-mobile-field flex items-center justify-between gap-3">
          <label class="mb-0" for="show_position_mobile_{{ cls.id }}">
            Show Position on Results
          </label>

          <label class="show-position-control flex-shrink-0">
            <input
              type="checkbox"
              id="show_position_mobile_{{ cls.id }}"
              name="show_position_{{ cls.id }}"
              {% if cls.score_setting.show_position %}checked{% endif %}
            >
          </label>
        </div>

      </div>
      {% endfor %}
    </div>

    <!-- SAVE -->
    <div class="mt-5 sm:mt-6">
      <button
        type="submit"
        class="save-settings-btn bg-blue-600 hover:bg-blue-700 text-white shadow transition"
      >
        Save Settings
      </button>
    </div>

  </form>
</div>

{% endblock %}
