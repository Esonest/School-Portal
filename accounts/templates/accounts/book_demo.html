{% extends "accounts/base.html" %}
{% block content %}

<div class="fixed inset-0 -z-10 bg-black">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,#4f46e520,transparent_40%)]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_bottom_left,#9333ea20,transparent_40%)]"></div>
</div>

<section class="text-center py-14 px-4">
    <h1 class="text-4xl font-bold text-white">Book a Demo</h1>
    <p class="text-gray-300 mt-3">Fill form → Save → Notify Admin on WhatsApp 💬</p>
</section>

<div class="max-w-3xl mx-auto px-4 pb-20">

<form method="POST" id="demoForm"
      class="bg-slate-900/80 backdrop-blur-xl border border-white/10 rounded-3xl p-8 space-y-5">

    {% csrf_token %}

    <input name="school_name" placeholder="School Name" required
           class="w-full p-3 rounded-xl bg-black/40 text-white border border-white/10">

    <input name="contact_person" placeholder="Contact Person" required
           class="w-full p-3 rounded-xl bg-black/40 text-white border border-white/10">

    <input type="email" name="email" placeholder="Email" required
           class="w-full p-3 rounded-xl bg-black/40 text-white border border-white/10">

    <input name="phone" placeholder="Phone" required
           class="w-full p-3 rounded-xl bg-black/40 text-white border border-white/10">

    <input name="student_population" placeholder="Student Population" required
           class="w-full p-3 rounded-xl bg-black/40 text-white border border-white/10">

    <textarea name="message" placeholder="Tell us about your school" required
              class="w-full p-3 h-28 rounded-xl bg-black/40 text-white border border-white/10"></textarea>

    <!-- SUBMIT BUTTON (DATABASE SAVE) -->
    <button type="submit"
            class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">
        💾 Save Booking
    </button>

    <!-- WHATSAPP BUTTON -->
    <button type="button" id="whatsappBtn"
            class="w-full py-3 rounded-xl bg-green-600 hover:bg-green-500 text-white font-semibold">
        💬 Send + Notify Admin on WhatsApp
    </button>

</form>

</div>

<script>
const form = document.getElementById("demoForm");
const whatsappBtn = document.getElementById("whatsappBtn");

// 👉 YOUR ADMIN WHATSAPP NUMBER (CHANGE THIS)
const ADMIN_NUMBER = "2347085734441";

// BUILD MESSAGE
function buildMessage(data) {
    return `🔥 NEW DEMO BOOKING

🏫 School: ${data.get("school_name")}
👤 Contact: ${data.get("contact_person")}
📧 Email: ${data.get("email")}
📞 Phone: ${data.get("phone")}
👨‍🎓 Students: ${data.get("student_population")}

📝 Message:
${data.get("message")}`;
}

// WHATSAPP CLICK
whatsappBtn.addEventListener("click", function () {

    const data = new FormData(form);

    // VALIDATION (ALL FIELDS REQUIRED)
    for (let [key, value] of data.entries()) {
        if (!value.trim()) {
            alert("Please fill all fields before continuing.");
            return;
        }
    }

    const message = buildMessage(data);

    // 1. SEND TO ADMIN WHATSAPP
    const adminURL = "https://wa.me/" + ADMIN_NUMBER + "?text=" + encodeURIComponent(message);
    window.open(adminURL, "_blank");

    // 2. ALSO OPEN USER CONFIRMATION (optional fallback)
    setTimeout(() => {
        alert("Booking saved. Admin has been notified on WhatsApp.");
    }, 800);
});
</script>

{% endblock %}
