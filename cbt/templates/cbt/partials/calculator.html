{% if exam.allow_calculator %}

<!-- OPEN BUTTON -->
<button onclick="openCalculator()" class="calc-open-btn">
    Calculator
</button>

<!-- CALCULATOR WINDOW -->
<div id="calculator"
     class="fixed bottom-0 right-0 bg-gray-800 text-white
            rounded-t-2xl sm:rounded-xl shadow-2xl hidden z-50
            w-full sm:w-96
            h-[85vh] sm:h-auto
            overflow-hidden">
            

 <!-- CALCULATOR HEADER -->
<div id="calc-header"
     style="display:flex; justify-content:space-between; align-items:center;
            background:#1f2937; padding:10px; border-top-left-radius:12px; border-top-right-radius:12px;
            cursor:move; user-select:none; width:100%;">
    <span style="font-weight:600; color:white; font-size:14px;">Scientific Calculator</span>
    <div style="display:flex; gap:8px;">
        <!-- Minimize -->
        <button onclick="minimizeCalculator()" 
                style="font-weight:bold; color:#facc15; background:transparent; border:none; font-size:18px; cursor:pointer;"
                title="Minimize">—</button>
        <!-- Close -->
        <button onclick="closeCalculator()" 
                style="font-weight:bold; color:#f87171; background:transparent; border:none; font-size:18px; cursor:pointer;"
                title="Close">✕</button>
    </div>
</div>



    <!-- DISPLAY -->
    <div class="calc-display-wrapper">
        <input id="display" type="text" readonly>
    </div>

    <!-- DEG/RAD -->
    <div class="calc-mode-wrapper">
        <button onclick="toggleMode()" id="modeBtn">DEG</button>
        <button onclick="clearDisplay()" class="calc-clear">C</button>
    </div>

   <!-- BUTTON GRID -->
<div class="calc-grid">

    <!-- Memory Row -->
    <button onclick="memoryClear()">MC</button>
    <button onclick="memoryRecall()">MR</button>
    <button onclick="memoryAdd()">M+</button>
    <button onclick="memorySubtract()">M−</button>
    <button onclick="clearDisplay()">AC</button>

    <!-- 7 8 9 -->
    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button onclick="append('/')">÷</button>
    <button onclick="append('Math.sqrt(')">√</button>

    <!-- 4 5 6 -->
    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button onclick="append('*')">×</button>
    <button onclick="append('**2')">x²</button>

    <!-- 1 2 3 -->
    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button onclick="append('-')">−</button>
    <button onclick="append('Math.pow(')">xʸ</button>

    <!-- 0 row -->
    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button onclick="append('Math.PI')">π</button>
    <button onclick="append('+')">+</button>
    <button onclick="calculate()" class="calc-equal">=</button>

    <!-- Last Row -->
    <button onclick="append('(')">(</button>
    <button onclick="append(')')">)</button>
    <button onclick="deleteLast()">DEL</button>
    <button onclick="append('Math.sin(')">sin</button>
    <button onclick="append('Math.cos(')">cos</button>

    <!-- Final Scientific -->
    <button onclick="append('Math.tan(')">tan</button>
    <button onclick="append('Math.log10(')">log</button>
    <button onclick="append('Math.log(')">ln</button>
    <button onclick="append('Math.E')">e</button>

</div>

</div>

<!-- ====== STYLES ====== -->
<style>
.calc-open-btn {
    position: fixed;
    bottom: 12px;
    right: 12px;
    background: #2563eb;
    color: white;
    padding: 10px 16px;
    border-radius: 9999px;
    font-weight: 600;
    z-index: 50;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}

.calculator {
    position: fixed;
    bottom: 70px;
    right: 12px;
    width: 90%;
    max-width: 400px;
    background: #1f2937;
    color: white;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    z-index: 50;
    touch-action: none;
}

.calc-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111827;
    padding: 10px 12px;
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
    cursor: move;
}

.calc-title { font-weight: 600; }
.calc-controls button { margin-left: 6px; font-weight: bold; }

.calc-display-wrapper { padding: 10px; }
#display {
    width: 100%;
    padding: 12px;
    font-size: 1.25rem;
    border-radius: 6px;
    border: none;
    text-align: right;
    color: black;
}

.calc-mode-wrapper {
    padding: 0 10px 10px;
    display: flex;
    gap: 6px;
}
.calc-mode-wrapper button {
    background: #7c3aed;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.875rem;
}

.calc-clear {
    background: #dc2626;
}

.calc-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 10px;
    overflow-y: auto;
}

.calc-grid button {
    padding: 12px 6px;
    border-radius: 8px;
    background: #374151;
    font-size: 0.9rem;
    user-select: none;
    text-align: center;
    min-height: 48px;
    transition: 0.2s ease;
}

.calc-grid button:active {
    transform: scale(0.95);
    background: #4b5563;
}

.calc-grid button:hover { background: #4b5563; }
.calc-equal { background: #16a34a !important; }

@media (max-width: 640px) {

    #calculator {
        border-radius: 16px 16px 0 0;
        left: 0 !important;
        right: 0 !important;
        bottom: 0;
        top: auto !important;
    }

    .calc-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
    }

    .calc-grid button {
        font-size: 0.8rem;
        padding: 10px 4px;
        min-height: 44px;
    }

    #display {
        font-size: 1.1rem;
        padding: 12px;
    }
}


#calculator {
    display: flex;
    flex-direction: column;
}

.calc-grid {
    flex: 1;
}

</style>

<!-- ====== SCRIPT ====== -->
<script>
let memory = 0;
let isDegree = true;
const calc = document.getElementById("calculator");
const display = document.getElementById("display");

function openCalculator() { calc.classList.remove("hidden"); }
function closeCalculator() { calc.classList.add("hidden"); }
function minimizeCalculator() { calc.classList.toggle("h-16"); }

function append(value) { display.value += value; }
function clearDisplay() { display.value = ""; }
function deleteLast() { display.value = display.value.slice(0, -1); }
function toggleMode() {
    isDegree = !isDegree;
    document.getElementById("modeBtn").innerText = isDegree ? "DEG" : "RAD";
}
function calculate() {
    try {
        let expr = display.value;
        if (isDegree) {
            expr = expr.replace(/Math.sin\((.*?)\)/g, (_, v) => Math.sin(eval(v) * Math.PI/180));
            expr = expr.replace(/Math.cos\((.*?)\)/g, (_, v) => Math.cos(eval(v) * Math.PI/180));
            expr = expr.replace(/Math.tan\((.*?)\)/g, (_, v) => Math.tan(eval(v) * Math.PI/180));
        }
        display.value = eval(expr);
    } catch { display.value = "Error"; }
}

/* Memory */
function memoryClear() { memory = 0; }
function memoryRecall() { display.value += memory; }
function memoryAdd() { memory += parseFloat(display.value) || 0; }
function memorySubtract() { memory -= parseFloat(display.value) || 0; }

/* Dragging (mobile + desktop) */
dragElement(calc);
function dragElement(elmnt) {
    const header = document.getElementById("calc-header");
    let pos1=0,pos2=0,pos3=0,pos4=0;
    header.onpointerdown = dragMouseDown;

    function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX; pos4 = e.clientY;
        document.onpointerup = closeDrag;
        document.onpointermove = elementDrag;
    }
    function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX; pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
    }
    function closeDrag() {
        document.onpointerup = null;
        document.onpointermove = null;
    }
}
</script>

{% endif %}
