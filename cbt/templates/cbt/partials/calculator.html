<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
.btn {
    background: #374151;
    padding: 6px;
    border-radius: 6px;
}
.btn:hover {
    background: #4b5563;
}
</style>

</head>
<body>
    {% if exam.allow_calculator %}
     
<!-- OPEN BUTTON -->
<button onclick="openCalculator()"
        class="fixed bottom-4 right-4 bg-blue-600 text-white px-4 py-2 rounded-full shadow-lg z-50">
    Calculator
</button>

<!-- CALCULATOR WINDOW -->
<div id="calculator"
     class="fixed bottom-20 right-6 w-96 bg-gray-800 text-white rounded-xl shadow-2xl hidden z-50">

    <!-- HEADER -->
    <div id="calc-header"
         class="flex justify-between items-center bg-gray-900 px-4 py-2 cursor-move rounded-t-xl">
        <span class="font-semibold">Scientific Calculator</span>
        <div class="space-x-2">
            <button onclick="minimizeCalculator()" class="text-yellow-400">—</button>
            <button onclick="closeCalculator()" class="text-red-500">✕</button>
        </div>
    </div>

    <!-- DISPLAY -->
    <div class="p-3">
        <input id="display"
               type="text"
               class="w-full p-3 text-right text-black rounded text-lg"
               readonly>
    </div>

    <!-- DEG/RAD -->
    <div class="px-3 pb-2">
        <button onclick="toggleMode()" id="modeBtn"
                class="bg-purple-600 px-3 py-1 rounded text-sm">
            DEG
        </button>
    </div>

    <!-- BUTTON GRID -->
    <div class="grid grid-cols-5 gap-2 p-3 text-sm">

        <!-- Memory -->
        <button onclick="memoryClear()" class="btn">MC</button>
        <button onclick="memoryRecall()" class="btn">MR</button>
        <button onclick="memoryAdd()" class="btn">M+</button>
        <button onclick="memorySubtract()" class="btn">M−</button>
        <button onclick="clearDisplay()" class="btn">AC</button>

        <!-- Row -->
        <button onclick="append('7')" class="btn">7</button>
        <button onclick="append('8')" class="btn">8</button>
        <button onclick="append('9')" class="btn">9</button>
        <button onclick="append('/')" class="btn">÷</button>
        <button onclick="append('Math.sqrt(')" class="btn">√</button>

        <button onclick="append('4')" class="btn">4</button>
        <button onclick="append('5')" class="btn">5</button>
        <button onclick="append('6')" class="btn">6</button>
        <button onclick="append('*')" class="btn">×</button>
        <button onclick="append('**2')" class="btn">x²</button>

        <button onclick="append('1')" class="btn">1</button>
        <button onclick="append('2')" class="btn">2</button>
        <button onclick="append('3')" class="btn">3</button>
        <button onclick="append('-')" class="btn">−</button>
        <button onclick="append('Math.pow(')" class="btn">xʸ</button>

        <button onclick="append('0')" class="btn">0</button>
        <button onclick="append('.')" class="btn">.</button>
        <button onclick="append('+')" class="btn">+</button>
        <button onclick="calculate()" class="bg-green-600 rounded">=</button>
        <button onclick="deleteLast()" class="btn">DEL</button>

        <!-- Scientific -->
        <button onclick="append('Math.sin(')" class="btn">sin</button>
        <button onclick="append('Math.cos(')" class="btn">cos</button>
        <button onclick="append('Math.tan(')" class="btn">tan</button>
        <button onclick="append('Math.log10(')" class="btn">log</button>
        <button onclick="append('Math.log(')" class="btn">ln</button>

        <button onclick="append('Math.PI')" class="btn">π</button>
        <button onclick="append('Math.E')" class="btn">e</button>
        <button onclick="append('(')" class="btn">(</button>
        <button onclick="append(')')" class="btn">)</button>

    </div>
</div>

{% endif %}

<script>
let memory = 0;
let isDegree = true;

const calc = document.getElementById("calculator");
const display = document.getElementById("display");

function openCalculator() {
    calc.classList.remove("hidden");
}

function closeCalculator() {
    calc.classList.add("hidden");
}

function minimizeCalculator() {
    calc.classList.toggle("h-16");
}

function append(value) {
    display.value += value;
}

function clearDisplay() {
    display.value = "";
}

function deleteLast() {
    display.value = display.value.slice(0, -1);
}

function toggleMode() {
    isDegree = !isDegree;
    document.getElementById("modeBtn").innerText = isDegree ? "DEG" : "RAD";
}

function calculate() {
    try {
        let expression = display.value;

        if (isDegree) {
            expression = expression.replace(/Math.sin\((.*?)\)/g,
                (_, v) => Math.sin(eval(v) * Math.PI/180));
            expression = expression.replace(/Math.cos\((.*?)\)/g,
                (_, v) => Math.cos(eval(v) * Math.PI/180));
            expression = expression.replace(/Math.tan\((.*?)\)/g,
                (_, v) => Math.tan(eval(v) * Math.PI/180));
        }

        display.value = eval(expression);
    } catch {
        display.value = "Error";
    }
}

/* Memory */
function memoryClear() { memory = 0; }
function memoryRecall() { display.value += memory; }
function memoryAdd() { memory += parseFloat(display.value) || 0; }
function memorySubtract() { memory -= parseFloat(display.value) || 0; }

/* Dragging */
dragElement(calc);

function dragElement(elmnt) {
  const header = document.getElementById("calc-header");
  let pos1=0,pos2=0,pos3=0,pos4=0;

  header.onmousedown = dragMouseDown;

  function dragMouseDown(e) {
    e.preventDefault();
    pos3 = e.clientX;
    pos4 = e.clientY;
    document.onmouseup = closeDrag;
    document.onmousemove = elementDrag;
  }

  function elementDrag(e) {
    e.preventDefault();
    pos1 = pos3 - e.clientX;
    pos2 = pos4 - e.clientY;
    pos3 = e.clientX;
    pos4 = e.clientY;
    elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
    elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
  }

  function closeDrag() {
    document.onmouseup = null;
    document.onmousemove = null;
  }
}
</script>


</body>
</html>
