{% extends "accounts/base.html" %}

{% block content %}

<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">

<div class="bg-white rounded-2xl shadow-lg p-8 max-w-lg w-full">


<h1 class="text-2xl font-bold text-red-600 mb-4">
Delete Public Event
</h1>


<p class="text-gray-700 mb-6">

Are you sure you want to delete:

<strong>
{{ live_class.title }}
</strong>

?

</p>


<p class="text-sm text-gray-500 mb-6">

This action cannot be undone.

</p>



<form method="POST">

{% csrf_token %}


<div class="flex gap-4">


<button
type="submit"
class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-semibold">

Delete Event

</button>



<a
href="{% url 'liveclass:public_event_manage' live_class.event_slug %}"
class="flex-1 text-center bg-gray-200 hover:bg-gray-300 py-3 rounded-xl font-semibold">

Cancel

</a>


</div>


</form>


</div>

</div>


{% endblock %}
