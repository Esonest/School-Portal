{% extends "accounts/base.html" %}
{% block content %}

<div class="h-screen flex flex-col bg-gray-100">

  <!-- HEADER -->
  <div class="bg-white shadow px-6 py-4 flex justify-between items-center">
    <h2 class="text-xl font-bold">{{ live_class.title }}</h2>

    <div class="flex items-center gap-4">
      <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg text-sm">
        👥 <span id="participant-count">0</span>
      </span>

      {% if is_moderator %}
      <button id="mute-all-btn"
        class="bg-yellow-500 text-white px-3 py-2 rounded-lg text-sm">
        🔇 Mute All
      </button>
      {% endif %}

      <button id="leave-btn"
        class="bg-red-600 text-white px-4 py-2 rounded-lg">
        Leave
      </button>
    </div>
  </div>

  <!-- VIDEO GRID -->
  <div id="video-grid"
    class="flex-1 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 p-4 overflow-auto">
  </div>

  <!-- CONTROLS -->
  <div class="bg-white shadow p-4 flex justify-center gap-4">

    <button id="mic-btn" class="bg-gray-200 px-4 py-2 rounded-lg">
      🎤 Mic
    </button>

    <button id="cam-btn" class="bg-gray-200 px-4 py-2 rounded-lg">
      📷 Camera
    </button>

    <button id="hand-btn" class="bg-yellow-500 text-white px-4 py-2 rounded-lg">
      ✋ Raise Hand
    </button>

    {% if is_moderator %}
    <button id="screen-btn"
      class="bg-blue-600 text-white px-4 py-2 rounded-lg">
      🖥 Share Screen
    </button>
    {% endif %}

  </div>

  <!-- CHAT -->
  <div class="fixed bottom-6 right-6 w-80 bg-white shadow-xl rounded-xl hidden flex-col"
       id="chat-box">
    <div class="bg-gray-800 text-white p-3 flex justify-between">
      Class Chat
      <button onclick="toggleChat()">✕</button>
    </div>
    <div id="chat-messages" class="p-3 h-60 overflow-y-auto text-sm"></div>
    <div class="p-2 border-t flex">
      <input id="chat-input"
        class="flex-1 border rounded px-2 text-sm"
        placeholder="Message..." />
      <button id="send-btn"
        class="ml-2 bg-blue-600 text-white px-3 rounded">
        Send
      </button>
    </div>
  </div>

  <button onclick="toggleChat()"
    class="fixed bottom-6 right-6 bg-blue-600 text-white p-4 rounded-full shadow-xl">
    💬
  </button>

</div>

<!-- 100ms CORE SDK -->
<script src="https://unpkg.com/@100mslive/hms-video-store@latest/dist/hms-video-store.min.js"></script>

<script>
const { HMSReactiveStore } = HMSVideoStore;

const hms = new HMSReactiveStore();
const actions = hms.getActions();
const store = hms.getStore();

const grid = document.getElementById("video-grid");
const countEl = document.getElementById("participant-count");

// ================= JOIN =================
actions.join({
  userName: "{{ request.user.get_full_name|escapejs }}",
  authToken: "{{ hms_token }}"
});

// ================= RENDER =================
function render() {
  const state = store.getState();
  grid.innerHTML = "";
  countEl.innerText = state.peers.length;

  state.peers.forEach(peer => {
    const track = state.tracks.find(
      t => t.peerId === peer.id && t.type === "video"
    );

    const box = document.createElement("div");
    box.className = "bg-black rounded-lg relative overflow-hidden";

    const video = document.createElement("video");
    video.autoplay = true;
    video.playsInline = true;
    video.className = "w-full h-48 object-cover";

    if (track) actions.attachVideo(track.id, video);

    const label = document.createElement("div");
    label.className =
      "absolute bottom-2 left-2 bg-black bg-opacity-50 text-white text-xs px-2 py-1 rounded";
    label.innerText = peer.name;

    box.append(video, label);
    grid.appendChild(box);
  });
}

store.subscribe(render);

// ================= CONTROLS =================
document.getElementById("mic-btn").onclick =
  () => actions.setLocalAudioEnabled(
    !store.getState().localPeer.audioTrack?.enabled
  );

document.getElementById("cam-btn").onclick =
  () => actions.setLocalVideoEnabled(
    !store.getState().localPeer.videoTrack?.enabled
  );

// ================= RAISE HAND =================
document.getElementById("hand-btn").onclick =
  () => actions.sendBroadcastMessage("HAND_RAISED");

// ================= CHAT =================
document.getElementById("send-btn").onclick = () => {
  const input = document.getElementById("chat-input");
  if (!input.value) return;
  actions.sendBroadcastMessage(input.value);
  input.value = "";
};

store.subscribe(() => {
  const msgs = store.getState().messages;
  const box = document.getElementById("chat-messages");
  box.innerHTML = "";
  msgs.forEach(m => {
    const div = document.createElement("div");
    div.innerText = `${m.senderName}: ${m.message}`;
    box.appendChild(div);
  });
});

// ================= MODERATOR =================
{% if is_moderator %}
document.getElementById("screen-btn").onclick =
  () => actions.setScreenShareEnabled(true);

document.getElementById("mute-all-btn").onclick =
  () => store.getState().peers.forEach(p => {
    if (!p.isLocal) actions.setRemoteTrackEnabled(p.audioTrack, false);
  });

// Auto-end class when teacher leaves
window.addEventListener("beforeunload", () => {
  actions.leave();
});
{% endif %}

// ================= LEAVE =================
document.getElementById("leave-btn").onclick = async () => {
  await actions.leave();
  navigator.sendBeacon("{% url 'liveclass:liveclass_leave' live_class.id %}");
  window.location.href = "{% url 'liveclass:liveclass_list' %}";
};

// ================= UI =================
function toggleChat() {
  document.getElementById("chat-box").classList.toggle("hidden");
}
</script>

{% endblock %}
