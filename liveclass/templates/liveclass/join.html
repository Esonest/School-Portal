{% extends "accounts/base.html" %}
{% block content %}

<div class="max-w-7xl mx-auto px-4 sm:px-6 py-6">

    <!-- CLASS HEADER -->
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl sm:text-3xl font-bold">{{ live_class.title }}</h2>

        <div class="flex gap-4">
            <div class="bg-gray-100 px-4 py-2 rounded-lg text-sm font-semibold">
                ⏱ <span id="class-timer">00:00:00</span>
            </div>
            <div class="bg-blue-50 text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold">
                👥 <span id="attendance-count">0</span>
            </div>
            <button id="leave-btn" class="bg-red-600 text-white px-4 py-2 rounded-lg">🚪 Leave Class</button>
        </div>
    </div>

    <!-- TEACHER YOUTUBE STREAM -->
    <div class="mb-4">
        <iframe id="youtube-iframe" width="100%" height="400"
            src="{{ live_class.https://youtube.com/@esonestlimited6213 }}?autoplay=1"
            frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
        </iframe>
    </div>

    <!-- STUDENT VIDEO GRID -->
    <div id="student-video-grid" class="grid grid-cols-3 gap-2 mb-4"></div>
    <button id="enable-camera-btn" class="bg-green-600 text-white px-4 py-2 rounded-lg mb-4">
        Enable My Camera
    </button>

    <!-- RAISE HAND -->
    <button id="raise-hand-btn" class="w-full bg-yellow-500 text-white py-2 rounded-lg text-sm hover:bg-yellow-600 mb-4">
        ✋ Raise Hand
    </button>

    <!-- CHAT BOX -->
    <div id="chat-box" class="fixed bottom-6 right-6 w-80 bg-white shadow-2xl rounded-2xl hidden flex flex-col overflow-hidden z-50">
        <div class="bg-gray-800 text-white p-3 text-sm flex justify-between">
            Classroom Chat
            <button onclick="toggleChat()">✕</button>
        </div>
        <div id="chat-messages" class="p-3 h-60 overflow-y-auto text-sm space-y-2"></div>
        <div class="p-2 border-t flex">
            <input id="chat-input" class="flex-1 border rounded-lg px-2 text-sm" placeholder="Type message...">
            <button id="chat-send-btn" class="ml-2 bg-blue-600 text-white px-3 rounded-lg text-sm">Send</button>
        </div>
    </div>
    <button onclick="toggleChat()" class="fixed bottom-6 right-6 bg-blue-600 text-white p-4 rounded-full shadow-xl">💬</button>
</div>

<!-- PEERJS -->
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

<script>
let attendanceStarted = false;
let timer = null;
let seconds = 0;
const maxDuration = 7200;
let participantCount = 0;

const classTimer = document.getElementById("class-timer");
const attendanceCount = document.getElementById("attendance-count");
const leaveBtn = document.getElementById("leave-btn");
const enableCameraBtn = document.getElementById("enable-camera-btn");
const studentVideoGrid = document.getElementById("student-video-grid");
const raiseHandBtn = document.getElementById("raise-hand-btn");

let localStream;
let peer;
let peers = {};

const studentId = "{{ request.user.id }}";
const liveClassId = "{{ live_class.id }}";

// ===== TIMER =====
function startTimer() {
    timer = setInterval(() => {
        seconds++;
        const hrs = String(Math.floor(seconds / 3600)).padStart(2,'0');
        const mins = String(Math.floor((seconds % 3600)/60)).padStart(2,'0');
        const secs = String(seconds % 60).padStart(2,'0');
        classTimer.innerText = `${hrs}:${mins}:${secs}`;
        if(seconds >= maxDuration) leaveClass();
    }, 1000);
}

// ===== PARTICIPANT COUNTER =====
function incrementParticipant() {
    participantCount++;
    attendanceCount.innerText = participantCount;
}
function decrementParticipant() {
    participantCount = Math.max(0, participantCount - 1);
    attendanceCount.innerText = participantCount;
}

// ===== PEERJS SETUP =====
peer = new Peer(studentId, {
    host: 'YOUR_PEERJS_SERVER_DOMAIN',  // replace with your PeerJS server
    port: 9000,
    path: '/'
});

peer.on('call', call => {
    call.answer(localStream);
    const videoEl = document.createElement("video");
    call.on('stream', remoteStream => addRemoteVideo(videoEl, remoteStream));
});

// ===== ENABLE CAMERA =====
enableCameraBtn.addEventListener("click", async () => {
    if(localStream) return;

    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const videoEl = document.createElement("video");
        videoEl.srcObject = localStream;
        videoEl.autoplay = true;
        videoEl.muted = true;
        videoEl.className = "rounded shadow-lg w-full h-32 object-cover";
        studentVideoGrid.appendChild(videoEl);

        incrementParticipant();

        await fetch("{% url 'liveclass:liveclass_enable_camera' live_class.id %}", {
            method: "POST",
            headers: {"X-CSRFToken": "{{ csrf_token }}"}
        });

        // Connect to other students
        fetch(`/liveclass/{{ live_class.id }}/peers/`)
            .then(r => r.json())
            .then(ids => {
                ids.forEach(id => {
                    if(id === studentId || peers[id]) return;
                    const call = peer.call(id, localStream);
                    const remoteVideo = document.createElement("video");
                    call.on('stream', remoteStream => addRemoteVideo(remoteVideo, remoteStream));
                    call.on('close', decrementParticipant);
                    peers[id] = call;
                });
            });

        attendanceStarted = true;
        startTimer();

    } catch(err){
        console.error(err);
        alert("Cannot access camera/mic.");
    }
});

// Add remote video
function addRemoteVideo(videoEl, stream){
    videoEl.srcObject = stream;
    videoEl.autoplay = true;
    videoEl.className = "rounded shadow-lg w-full h-32 object-cover";
    studentVideoGrid.appendChild(videoEl);
    incrementParticipant();
}

// ===== LEAVE CLASS =====
function leaveClass(){
    if(!attendanceStarted) return;
    attendanceStarted = false;

    if(localStream){
        localStream.getTracks().forEach(track => track.stop());
    }

    for(let id in peers) peers[id].close();
    clearInterval(timer);

    navigator.sendBeacon("{% url 'liveclass:liveclass_leave' live_class.id %}");
    window.location.href = "{% url 'liveclass:liveclass_list' %}";
}
leaveBtn.addEventListener("click", leaveClass);
window.addEventListener("beforeunload", leaveClass);

// ===== CHAT + RAISE HAND (WEBSOCKET) =====
const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
const chatSocket = new WebSocket(`${wsScheme}://${window.location.host}/ws/liveclass/${liveClassId}/`);

chatSocket.onmessage = function(e){
    const data = JSON.parse(e.data);
    const msgContainer = document.getElementById("chat-messages");

    if(data.action === "raise_hand"){
        const handMsg = document.createElement("div");
        handMsg.className = "bg-yellow-50 p-2 rounded";
        handMsg.innerText = `${data.sender} raised their hand ✋`;
        msgContainer.appendChild(handMsg);
    } else {
        const chatMsg = document.createElement("div");
        chatMsg.className = "bg-blue-50 p-2 rounded";
        chatMsg.innerText = `${data.sender}: ${data.message}`;
        msgContainer.appendChild(chatMsg);
    }
    msgContainer.scrollTop = msgContainer.scrollHeight;
};

// Send chat
document.getElementById("chat-send-btn").addEventListener("click", () => {
    const input = document.getElementById("chat-input");
    if(!input.value) return;
    chatSocket.send(JSON.stringify({
        message: input.value,
        sender: "{{ request.user.get_full_name }}",
        action: "chat"
    }));
    input.value = "";
});

// Raise hand
raiseHandBtn.addEventListener("click", () => {
    chatSocket.send(JSON.stringify({
        action: "raise_hand",
        sender: "{{ request.user.get_full_name }}"
    }));
});

// Toggle chat box
function toggleChat(){ document.getElementById("chat-box").classList.toggle("hidden"); }
</script>

{% endblock %}
