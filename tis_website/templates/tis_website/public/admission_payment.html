{% extends "accounts/base.html" %}


{% block content %}


<div class="min-h-screen bg-gray-100 p-6">


<div class="max-w-xl mx-auto bg-white rounded-3xl shadow-xl p-8 text-center">


{% if school.logo %}

<img src="{{ school.logo.url }}"
class="w-24 h-24 rounded-full mx-auto">

{% endif %}


<h1 class="text-3xl font-bold text-blue-800 mt-4">

{{ school.name }}

</h1>


<h2 class="text-xl font-bold mt-8">

Admission Fee Payment

</h2>


<div class="mt-6 bg-blue-50 p-6 rounded-xl">


<p>
<strong>Student:</strong>

{{ application.student_name }}

</p>


<p class="mt-3">

<strong>Application Number:</strong>

{{ application.application_number }}

</p>


<p class="mt-3 text-2xl font-bold text-green-700">

₦{{ amount }}

</p>


</div>


<button onclick="payWithPaystack()"

class="mt-8 w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-xl font-bold">

Pay Admission Fee

</button>


</div>

</div>



<script src="https://js.paystack.co/v1/inline.js"></script>


<script>

function payWithPaystack(){


let handler = PaystackPop.setup({


key: "{{ paystack_key }}",


email: "{{ application.parent_email }}",


amount: "{{ amount|floatformat:0 }}00",


currency: "NGN",


ref: "TIS{{ application.application_number }}{{ application.id }}",


callback: function(response){


window.location.href =
"/admission/payment/verify/" +
response.reference + "/";


},


onClose:function(){

alert("Payment cancelled");

}


});


handler.openIframe();


}


</script>


{% endblock %}
