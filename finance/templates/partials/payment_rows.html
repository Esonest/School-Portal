{% for p in page_obj %}
<li class="bg-white dark:bg-gray-900 rounded-2xl shadow p-3 mb-2 flex flex-col sm:flex-row sm:justify-between sm:items-center hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors duration-150 break-words">

  <!-- Left: Student & Invoice Info -->
  <div class="mb-1 sm:mb-0">
    <p class="font-medium text-gray-800 dark:text-gray-100 break-words">{{ p.invoice.student }}</p>
    <p class="text-sm text-gray-500 dark:text-gray-400 break-words">{{ p.invoice.title }}</p>
    <p class="text-xs text-gray-400 dark:text-gray-500 break-words">Ref: {{ p.reference }}</p>
  </div>

  <!-- Right: Payment Amount & Date -->
  <div class="text-left sm:text-right">
    <p class="font-semibold text-green-600 dark:text-green-400 whitespace-nowrap">₦{{ p.amount|floatformat:2 }}</p>
    <p class="text-xs text-gray-500 dark:text-gray-400 whitespace-nowrap">
      {{ p.payment_date|date:"M d, Y H:i" }}
    </p>
  </div>

</li>
{% empty %}
<li class="text-gray-500 dark:text-gray-400 text-center py-6 rounded-lg border border-dashed border-gray-300 dark:border-gray-700">
  No payments found.
</li>
{% endfor %}
